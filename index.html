<!DOCTYPE html>
<html>
<head>
<title>Vishnu Portfolio</title>

<style>

body{
    font-family:Arial;
    background:#e6f7ff;
    text-align:center;
}

.card{
    background:white;
    width:80%;
    margin:auto;
    padding:20px;
    border-radius:15px;
}

button{
    background:blue;
    color:white;
    border:none;
    padding:10px 20px;
    border-radius:10px;
}

</style>

</head>

<body>

<div class="card">

<h1>Hello, I am Vishnu</h1>

<p>Aspiring Cloud Engineer</p>

<h2>Skills</h2>

<ul style="list-style:none;">
<li>Python</li>
<li>Linux</li>
<li>Cloud Computing</li>
<li>GitHub</li>
</ul>

<h2>Visitor Counter</h2>

<h1 id="count">0</h1>

<button onclick="increase()">Visit</button>

</div>

<script>

let count = localStorage.getItem("visitorCount") || 0;

document.getElementById("count").innerText = count;

function increase(){

    count++;

    localStorage.setItem("visitorCount", count);

    document.getElementById("count").innerText = count;
}

</script>

</body>
</html>
